[project]
name = "pysqldp"
version = "0.1.0"
description = "Differential privacy for SQL queries by query rewriting, in pure Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[project.scripts]
pysqldp = "pysqldp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "duckdb>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysqldp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
